<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>풀무원 바른 뿌요</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pm-green: #00953a;       /* 풀무원 그린 */
            --pm-green-dark: #006b2b;
            --pm-green-light: #e8f4e3;
            --pm-leaf: #8cc63f;
            --pm-cream: #fbf8f1;
            --pm-ink: #23322a;
            --pm-muted: #6b7a70;
            --pm-line: #dfe8d9;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            color: var(--pm-ink);
            background-color: var(--pm-cream);
            background-image:
                radial-gradient(circle at 12% 18%, rgba(140, 198, 63, 0.18) 0, transparent 38%),
                radial-gradient(circle at 88% 82%, rgba(0, 149, 58, 0.14) 0, transparent 42%);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 상단 브랜드 바 */
        .brand-bar {
            background: var(--pm-green);
        }

        .brand-mark {
            width: 38px; height: 38px;
            border-radius: 50% 50% 50% 8px;
            background: linear-gradient(145deg, var(--pm-leaf), var(--pm-green));
            display: flex; align-items: center; justify-content: center;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0, 149, 58, 0.3);
        }

        .card {
            background: #ffffff;
            border: 1px solid var(--pm-line);
            border-radius: 16px;
            box-shadow: 0 2px 6px rgba(35, 50, 42, 0.05);
        }

        .card-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--pm-muted);
        }

        .pm-btn {
            background: var(--pm-green);
            color: #fff;
            transition: background .2s, transform .1s;
        }
        .pm-btn:hover { background: var(--pm-green-dark); }
        .pm-btn:active { transform: scale(0.97); }

        .ctrl-btn {
            background: #fff;
            border: 1px solid var(--pm-line);
            color: var(--pm-green);
        }
        .ctrl-btn:active { background: var(--pm-green-light); transform: scale(0.95); }

        /* Canvas custom styling */
        .game-board-container {
            position: relative;
            background: linear-gradient(180deg, #ffffff 0%, var(--pm-green-light) 100%);
            border: 3px solid var(--pm-green);
            box-shadow: 0 10px 24px rgba(0, 107, 43, 0.15);
        }

        .combo-text {
            color: var(--pm-green);
            -webkit-text-stroke: 6px #fff;
            paint-order: stroke fill;
            text-shadow: 0 4px 12px rgba(0, 107, 43, 0.25);
        }

        /* Pulse and glow animations for combos */
        @keyframes comboGlow {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        .combo-text {
            animation: comboGlow 0.8s ease-out forwards;
        }

        /* Custom scrollbar style if needed */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 149, 58, 0.3);
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 overflow-x-hidden">

    <!-- Game Container -->
    <div class="w-full max-w-md bg-white rounded-3xl overflow-hidden border border-[#dfe8d9] shadow-[0_20px_50px_rgba(0,107,43,0.12)] flex flex-col items-center">

        <!-- Top brand strip -->
        <div class="brand-bar w-full text-white text-[11px] font-medium tracking-wide px-5 py-1.5 flex items-center justify-between">
            <span><i class="fas fa-seedling mr-1"></i>사람과 자연을 사랑하는 바른먹거리</span>
            <span class="opacity-80">PULMUONE</span>
        </div>

        <div class="w-full p-4 flex flex-col items-center">

        <!-- Header / Title -->
        <div class="w-full flex items-center justify-between mb-4 px-1">
            <div class="flex items-center gap-2.5">
                <div class="brand-mark"><i class="fas fa-leaf"></i></div>
                <div class="leading-tight">
                    <h1 class="text-xl sm:text-2xl font-black text-[#00953a] tracking-tight">풀무원 바른 뿌요</h1>
                    <p class="text-[11px] text-[#6b7a70] font-medium">신선한 재료 4개를 모아 터뜨려 보세요</p>
                </div>
            </div>
            <button id="soundToggleBtn" class="bg-[#e8f4e3] hover:bg-[#d6ecce] text-[#00953a] w-10 h-10 rounded-full transition-all active:scale-95 flex items-center justify-center">
                <i class="fas fa-volume-up text-base" id="soundIcon"></i>
            </button>
        </div>

        <!-- Main Layout Grid -->
        <div class="w-full flex gap-3 justify-center items-start">

            <!-- Game Canvas Board -->
            <div class="game-board-container rounded-2xl overflow-hidden relative">
                <canvas id="gameCanvas" class="block"></canvas>

                <!-- Overlay for Pause/Game Over -->
                <div id="overlay" class="absolute inset-0 bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center gap-3 transition-all duration-300 z-10">
                    <div class="brand-mark" style="width:52px;height:52px;font-size:22px"><i class="fas fa-seedling"></i></div>
                    <h2 id="overlayTitle" class="text-2xl sm:text-3xl font-black text-[#00953a]">바른 뿌요</h2>
                    <p id="overlaySub" class="text-[#6b7a70] text-xs sm:text-sm px-6 text-center leading-relaxed">방향키로 이동<br>Z, X 또는 ↑ 키로 회전</p>
                    <button id="startBtn" class="pm-btn font-bold py-2.5 px-8 rounded-full text-base shadow-md mt-1">
                        게임 시작
                    </button>
                </div>

                <!-- Floating Combo Text Container -->
                <div id="comboContainer" class="absolute inset-0 pointer-events-none flex items-center justify-center z-20"></div>
            </div>

            <!-- Sidebar Info Panel -->
            <div class="flex flex-col gap-2.5 w-28 sm:w-32">
                <!-- Next Piece Box -->
                <div class="card p-2.5 flex flex-col items-center">
                    <span class="card-label mb-1">NEXT</span>
                    <canvas id="nextCanvas" width="80" height="120" class="block"></canvas>
                </div>

                <!-- Score Board -->
                <div class="card p-2.5 flex flex-col items-center">
                    <span class="card-label">SCORE</span>
                    <span id="scoreText" class="text-xl sm:text-2xl font-black text-[#00953a]">0</span>
                </div>

                <!-- Max Chain Board -->
                <div class="card p-2.5 flex flex-col items-center">
                    <span class="card-label">MAX CHAIN</span>
                    <span id="maxChainText" class="text-lg sm:text-xl font-bold text-[#23322a]">0</span>
                </div>

                <!-- Level Board -->
                <div class="card p-2.5 flex flex-col items-center bg-[#e8f4e3]">
                    <span class="card-label">LEVEL</span>
                    <span id="levelText" class="text-base font-bold text-[#006b2b]">1</span>
                </div>
            </div>
        </div>

        <!-- Touch Controls for Mobile/Tablet -->
        <div class="w-full grid grid-cols-5 gap-1.5 mt-4 sm:hidden">
            <button id="btnLeft" class="ctrl-btn rounded-xl py-3 text-xl flex items-center justify-center"><i class="fas fa-arrow-left"></i></button>
            <button id="btnRight" class="ctrl-btn rounded-xl py-3 text-xl flex items-center justify-center"><i class="fas fa-arrow-right"></i></button>
            <button id="btnRotL" class="ctrl-btn rounded-xl py-3 text-xl flex items-center justify-center"><i class="fas fa-undo"></i></button>
            <button id="btnRotR" class="ctrl-btn rounded-xl py-3 text-xl flex items-center justify-center"><i class="fas fa-redo"></i></button>
            <button id="btnDown" class="pm-btn rounded-xl py-3 text-xl flex items-center justify-center"><i class="fas fa-arrow-down"></i></button>
        </div>

        </div>

        <!-- Footer -->
        <div class="w-full border-t border-[#dfe8d9] text-center text-[11px] text-[#6b7a70] py-2.5">
            <i class="fas fa-leaf text-[#8cc63f] mr-1"></i>토마토 · 블루베리 · 브로콜리 · 콩 · 가지
        </div>

    </div>

    <!-- Game Script -->
    <script>
        /**
         * Puyo Puyo Engine Script
         */

        // Audio System (Synthesized Web Audio API)
        class SoundSystem {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playPop(chain = 1) {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    
                    // Higher pitch for higher chain
                    const baseFreq = 300 + (chain * 70);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(baseFreq, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, this.ctx.currentTime + 0.15);

                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.15);
                } catch(e) {}
            }

            playMove() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.05);
                } catch(e) {}
            }

            playRotate() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.08);
                } catch(e) {}
            }

            playGameOver() {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(250, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(80, this.ctx.currentTime + 0.6);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.6);
                } catch(e) {}
            }
        }

        const sound = new SoundSystem();

        // Game Configuration & Constants
        const COLS = 6;
        const ROWS = 12;
        const HIDDEN_ROWS = 1; // Row index 0 is top hidden/spawn area
        const TOTAL_ROWS = ROWS + HIDDEN_ROWS;
        
        let BLOCK_SIZE = 32; // Dynamic setup on resize

        // Puyo Colors definition
        const COLORS = [
            null, // 0 = Empty
            { main: '#e5483b', light: '#ff9a8a', shadow: '#a82a20', leaf: '#3e9b2f' }, // 1: 토마토
            { main: '#4a63c9', light: '#9fb1f0', shadow: '#2b3d8f', leaf: '#3e9b2f' }, // 2: 블루베리
            { main: '#45a535', light: '#a8dc8a', shadow: '#24701b', leaf: '#1d5a15' }, // 3: 브로콜리
            { main: '#ebb92e', light: '#fbe39a', shadow: '#a67a0e', leaf: '#3e9b2f' }, // 4: 콩(두부)
            { main: '#8a4fb5', light: '#c9a3e6', shadow: '#5a2c80', leaf: '#3e9b2f' }  // 5: 가지
        ];

        // Canvas references
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');

        // UI elements
        const scoreText = document.getElementById('scoreText');
        const maxChainText = document.getElementById('maxChainText');
        const levelText = document.getElementById('levelText');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlaySub = document.getElementById('overlaySub');
        const startBtn = document.getElementById('startBtn');
        const comboContainer = document.getElementById('comboContainer');
        const soundToggleBtn = document.getElementById('soundToggleBtn');
        const soundIcon = document.getElementById('soundIcon');

        // Game State Variables
        let grid = [];
        let currentPiece = null;
        let nextPiece = null;
        let score = 0;
        let maxChain = 0;
        let level = 1;
        let isGameOver = false;
        let isPaused = true;
        let isProcessingChain = false;
        
        let dropCounter = 0;
        let dropInterval = 800; // ms per drop
        let lastTime = 0;

        let particles = [];

        // Piece Definition (Pair of Puyo)
        // Center Puyo (x, y) & Rotating Puyo relative (dx, dy)
        class Piece {
            constructor(c1, c2) {
                this.x = 2; // Col index
                this.y = 0; // Row index
                this.color1 = c1 || Math.floor(Math.random() * 4) + 1;
                this.color2 = c2 || Math.floor(Math.random() * 4) + 1;
                // Rotation state: 0: Top, 1: Right, 2: Bottom, 3: Left
                this.rotation = 0;
            }

            getOtherPos() {
                const offsets = [
                    { x: 0, y: -1 }, // 0: Top
                    { x: 1, y: 0 },  // 1: Right
                    { x: 0, y: 1 },  // 2: Bottom
                    { x: -1, y: 0 }  // 3: Left
                ];
                const off = offsets[this.rotation];
                return { x: this.x + off.x, y: this.y + off.y };
            }
        }

        // Initialize Canvas Sizing
        function resizeCanvas() {
            const containerWidth = Math.min(window.innerWidth - 120, 280);
            BLOCK_SIZE = Math.floor(containerWidth / COLS);
            
            canvas.width = COLS * BLOCK_SIZE;
            canvas.height = ROWS * BLOCK_SIZE;

            nextCanvas.width = 80;
            nextCanvas.height = 120;
        }

        // Initialize Grid Data Structure
        function initGrid() {
            grid = Array.from({ length: TOTAL_ROWS }, () => Array(COLS).fill(0));
        }

        // Generate Random Pair
        function getRandomPiece() {
            // Colors pool based on level (max 5 colors)
            const numColors = Math.min(4 + Math.floor((level - 1) / 3), 5);
            const c1 = Math.floor(Math.random() * numColors) + 1;
            const c2 = Math.floor(Math.random() * numColors) + 1;
            return new Piece(c1, c2);
        }

        // Draw Single Puyo with eye expressions and smooth design
        function drawPuyo(context, x, y, colorId, size, eyeScale = 1, isGhost = false) {
            if (!colorId || colorId === 0) return;
            const color = COLORS[colorId];
            const radius = (size / 2) * 0.9;
            const centerX = x + size / 2;
            const centerY = y + size / 2;

            context.save();

            if (isGhost) {
                context.globalAlpha = 0.3;
            }

            // Main Body Shadow
            context.beginPath();
            context.arc(centerX, centerY + 2, radius, 0, Math.PI * 2);
            context.fillStyle = color.shadow;
            context.fill();

            // Main Body Gradient
            context.beginPath();
            context.arc(centerX, centerY, radius, 0, Math.PI * 2);
            const grad = context.createRadialGradient(
                centerX - radius * 0.3, centerY - radius * 0.3, radius * 0.1,
                centerX, centerY, radius
            );
            grad.addColorStop(0, color.light);
            grad.addColorStop(0.7, color.main);
            grad.addColorStop(1, color.shadow);
            context.fillStyle = grad;
            context.fill();

            // Inner Highlight
            context.beginPath();
            context.arc(centerX - radius * 0.35, centerY - radius * 0.35, radius * 0.25, 0, Math.PI * 2);
            context.fillStyle = 'rgba(255, 255, 255, 0.6)';
            context.fill();

            // Eyes Drawing
            if (!isGhost) {
                const eyeOffsetX = radius * 0.3;
                const eyeOffsetY = -radius * 0.1;
                const eyeRadius = radius * 0.22 * eyeScale;

                // Left Eye
                context.beginPath();
                context.arc(centerX - eyeOffsetX, centerY + eyeOffsetY, eyeRadius, 0, Math.PI * 2);
                context.fillStyle = '#ffffff';
                context.fill();
                context.beginPath();
                context.arc(centerX - eyeOffsetX + 1, centerY + eyeOffsetY, eyeRadius * 0.5, 0, Math.PI * 2);
                context.fillStyle = '#1e293b';
                context.fill();

                // Right Eye
                context.beginPath();
                context.arc(centerX + eyeOffsetX, centerY + eyeOffsetY, eyeRadius, 0, Math.PI * 2);
                context.fillStyle = '#ffffff';
                context.fill();
                context.beginPath();
                context.arc(centerX + eyeOffsetX - 1, centerY + eyeOffsetY, eyeRadius * 0.5, 0, Math.PI * 2);
                context.fillStyle = '#1e293b';
                context.fill();

                // 볼터치
                context.fillStyle = 'rgba(255, 255, 255, 0.28)';
                context.beginPath();
                context.ellipse(centerX - radius * 0.55, centerY + radius * 0.25, radius * 0.14, radius * 0.08, 0, 0, Math.PI * 2);
                context.ellipse(centerX + radius * 0.55, centerY + radius * 0.25, radius * 0.14, radius * 0.08, 0, 0, Math.PI * 2);
                context.fill();
            }

            // 새싹 꼭지 (풀무원 자연 모티프)
            const topY = centerY - radius * 0.92;
            const leafLen = radius * 0.42;
            context.fillStyle = color.leaf;
            context.beginPath();
            context.ellipse(centerX + leafLen * 0.45, topY - leafLen * 0.2, leafLen * 0.5, leafLen * 0.22, -Math.PI / 6, 0, Math.PI * 2);
            context.fill();
            context.beginPath();
            context.ellipse(centerX - leafLen * 0.35, topY - leafLen * 0.12, leafLen * 0.38, leafLen * 0.18, Math.PI / 6, 0, Math.PI * 2);
            context.fill();

            context.restore();
        }

        // Render Entire Canvas
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background Grid Lines
            ctx.strokeStyle = 'rgba(0, 149, 58, 0.08)';
            ctx.lineWidth = 1;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    ctx.strokeRect(c * BLOCK_SIZE, r * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                }
            }

            // Draw Fixed Blocks on Grid
            for (let r = HIDDEN_ROWS; r < TOTAL_ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const colorId = grid[r][c];
                    if (colorId > 0) {
                        const drawY = (r - HIDDEN_ROWS) * BLOCK_SIZE;
                        drawPuyo(ctx, c * BLOCK_SIZE, drawY, colorId, BLOCK_SIZE);
                    }
                }
            }

            // Draw Active Controlled Piece
            if (currentPiece && !isProcessingChain) {
                const otherPos = currentPiece.getOtherPos();

                // Draw Center Puyo
                if (currentPiece.y >= HIDDEN_ROWS) {
                    drawPuyo(ctx, currentPiece.x * BLOCK_SIZE, (currentPiece.y - HIDDEN_ROWS) * BLOCK_SIZE, currentPiece.color1, BLOCK_SIZE);
                }

                // Draw Rotated Companion Puyo
                if (otherPos.y >= HIDDEN_ROWS) {
                    drawPuyo(ctx, otherPos.x * BLOCK_SIZE, (otherPos.y - HIDDEN_ROWS) * BLOCK_SIZE, currentPiece.color2, BLOCK_SIZE);
                }
            }

            // Render Particles
            updateAndDrawParticles();

            // Draw Next Piece Preview
            drawNextPiece();
        }

        // Render Next Piece Sidebar Canvas
        function drawNextPiece() {
            nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
            if (!nextPiece) return;

            const size = 32;
            const startX = (nextCanvas.width - size) / 2;
            const startY = (nextCanvas.height - size * 2) / 2;

            // Draw companion top, center bottom
            drawPuyo(nextCtx, startX, startY, nextPiece.color2, size);
            drawPuyo(nextCtx, startX, startY + size, nextPiece.color1, size);
        }

        // Particle System for Chain Explosions
        function createExplosion(x, y, colorId) {
            const count = 12;
            const color = COLORS[colorId] ? COLORS[colorId].main : '#ffffff';

            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
                const speed = 2 + Math.random() * 4;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 3 + Math.random() * 3,
                    color: color,
                    alpha: 1,
                    life: 1
                });
            }
        }

        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.15; // Gravity
                p.alpha -= 0.03;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Show Visual Floating Text for Combos
        function showComboText(chainCount) {
            const el = document.createElement('div');
            el.className = 'combo-text absolute text-center font-black text-3xl sm:text-4xl pointer-events-none';
            el.innerText = `${chainCount} 연쇄!`;
            comboContainer.appendChild(el);

            setTimeout(() => {
                if (el.parentNode) el.parentNode.removeChild(el);
            }, 800);
        }

        // Collision Check Logic
        function isValidPos(x, y, rotation, puyo) {
            const offsets = [
                { x: 0, y: -1 },
                { x: 1, y: 0 },
                { x: 0, y: 1 },
                { x: -1, y: 0 }
            ];
            const off = offsets[rotation];
            const x2 = x + off.x;
            const y2 = y + off.y;

            // Check center
            if (x < 0 || x >= COLS || y >= TOTAL_ROWS) return false;
            if (y >= 0 && grid[y][x] !== 0) return false;

            // Check companion
            if (x2 < 0 || x2 >= COLS || y2 >= TOTAL_ROWS) return false;
            if (y2 >= 0 && grid[y2][x2] !== 0) return false;

            return true;
        }

        // Lock Active Piece to Grid
        function lockPiece() {
            if (!currentPiece) return;
            
            const otherPos = currentPiece.getOtherPos();
            
            if (currentPiece.y >= 0 && currentPiece.y < TOTAL_ROWS) {
                grid[currentPiece.y][currentPiece.x] = currentPiece.color1;
            }
            if (otherPos.y >= 0 && otherPos.y < TOTAL_ROWS) {
                grid[otherPos.y][otherPos.x] = currentPiece.color2;
            }

            currentPiece = null;
            processChains();
        }

        // Gravity Effect: Drop Floating Puyos
        function applyGravity() {
            let moved = false;
            for (let c = 0; c < COLS; c++) {
                for (let r = TOTAL_ROWS - 2; r >= 0; r--) {
                    if (grid[r][c] !== 0 && grid[r + 1][c] === 0) {
                        let targetR = r;
                        while (targetR + 1 < TOTAL_ROWS && grid[targetR + 1][c] === 0) {
                            targetR++;
                        }
                        grid[targetR][c] = grid[r][c];
                        grid[r][c] = 0;
                        moved = true;
                    }
                }
            }
            return moved;
        }

        // Flood Fill Algorithm to Find Connected Match Groups
        function findMatches() {
            const visited = Array.from({ length: TOTAL_ROWS }, () => Array(COLS).fill(false));
            const matchedCoords = [];

            for (let r = HIDDEN_ROWS; r < TOTAL_ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const color = grid[r][c];
                    if (color > 0 && !visited[r][c]) {
                        const group = [];
                        const queue = [{ r, c }];
                        visited[r][c] = true;

                        while (queue.length > 0) {
                            const curr = queue.shift();
                            group.push(curr);

                            const neighbors = [
                                { r: curr.r - 1, c: curr.c },
                                { r: curr.r + 1, c: curr.c },
                                { r: curr.r, c: curr.c - 1 },
                                { r: curr.r, c: curr.c + 1 }
                            ];

                            for (const n of neighbors) {
                                if (n.r >= HIDDEN_ROWS && n.r < TOTAL_ROWS && n.c >= 0 && n.c < COLS) {
                                    if (!visited[n.r][n.c] && grid[n.r][n.c] === color) {
                                        visited[n.r][n.c] = true;
                                        queue.push(n);
                                    }
                                }
                            }
                        }

                        // 4 or more connected puyos form a match
                        if (group.length >= 4) {
                            matchedCoords.push(...group);
                        }
                    }
                }
            }
            return matchedCoords;
        }

        // Main Loop Async Controller for Explosions and Gravity Chains
        async function processChains() {
            isProcessingChain = true;
            let currentChain = 0;

            while (true) {
                // Drop any ungrounded Puyos first
                let gravityMoved = applyGravity();
                if (gravityMoved) {
                    draw();
                    await new Promise(res => setTimeout(res, 180));
                }

                // Check for matches
                const matches = findMatches();
                if (matches.length === 0) break; // Chain ends

                currentChain++;
                sound.playPop(currentChain);
                showComboText(currentChain);

                // Update Max Chain Tracking
                if (currentChain > maxChain) {
                    maxChain = currentChain;
                    maxChainText.innerText = maxChain;
                }

                // Calculate Score
                const popCount = matches.length;
                const chainBonus = Math.pow(2, currentChain - 1) * 10;
                score += popCount * chainBonus;
                scoreText.innerText = score;

                // Level Up Check
                level = Math.floor(score / 2000) + 1;
                levelText.innerText = level;
                dropInterval = Math.max(150, 800 - (level - 1) * 70);

                // Clear matched blocks & trigger particle effects
                matches.forEach(m => {
                    const colorId = grid[m.r][m.c];
                    const px = m.c * BLOCK_SIZE + BLOCK_SIZE / 2;
                    const py = (m.r - HIDDEN_ROWS) * BLOCK_SIZE + BLOCK_SIZE / 2;
                    createExplosion(px, py, colorId);
                    grid[m.r][m.c] = 0;
                });

                draw();
                await new Promise(res => setTimeout(res, 350));
            }

            isProcessingChain = false;
            spawnPiece();
        }

        // Spawn New Active Piece
        function spawnPiece() {
            if (isGameOver) return;

            currentPiece = nextPiece || getRandomPiece();
            nextPiece = getRandomPiece();

            // Set spawn position
            currentPiece.x = 2;
            currentPiece.y = 1;
            currentPiece.rotation = 0;

            // Game Over Check (Spawn position blocked)
            if (!isValidPos(currentPiece.x, currentPiece.y, currentPiece.rotation, currentPiece)) {
                handleGameOver();
            }
        }

        // Movement Controls
        function moveLeft() {
            if (!currentPiece || isProcessingChain || isPaused) return;
            if (isValidPos(currentPiece.x - 1, currentPiece.y, currentPiece.rotation, currentPiece)) {
                currentPiece.x--;
                sound.playMove();
            }
        }

        function moveRight() {
            if (!currentPiece || isProcessingChain || isPaused) return;
            if (isValidPos(currentPiece.x + 1, currentPiece.y, currentPiece.rotation, currentPiece)) {
                currentPiece.x++;
                sound.playMove();
            }
        }

        function moveDown() {
            if (!currentPiece || isProcessingChain || isPaused) return;
            if (isValidPos(currentPiece.x, currentPiece.y + 1, currentPiece.rotation, currentPiece)) {
                currentPiece.y++;
                score += 1;
                scoreText.innerText = score;
                dropCounter = 0;
            } else {
                lockPiece();
            }
        }

        function rotate(dir = 1) { // 1: Clockwise, -1: Counter-Clockwise
            if (!currentPiece || isProcessingChain || isPaused) return;

            const nextRot = (currentPiece.rotation + dir + 4) % 4;

            // Basic Rotation Check
            if (isValidPos(currentPiece.x, currentPiece.y, nextRot, currentPiece)) {
                currentPiece.rotation = nextRot;
                sound.playRotate();
                return;
            }

            // Wall-kick Check (Try moving left or right to accommodate rotation)
            const kickOffsets = [-1, 1];
            for (let kick of kickOffsets) {
                if (isValidPos(currentPiece.x + kick, currentPiece.y, nextRot, currentPiece)) {
                    currentPiece.x += kick;
                    currentPiece.rotation = nextRot;
                    sound.playRotate();
                    return;
                }
            }
        }

        // Main Game Loop Update Routine
        function update(time = 0) {
            const deltaTime = time - lastTime;
            lastTime = time;

            if (!isPaused && !isGameOver && !isProcessingChain) {
                dropCounter += deltaTime;
                if (dropCounter > dropInterval) {
                    if (currentPiece) {
                        if (isValidPos(currentPiece.x, currentPiece.y + 1, currentPiece.rotation, currentPiece)) {
                            currentPiece.y++;
                        } else {
                            lockPiece();
                        }
                    }
                    dropCounter = 0;
                }
            }

            draw();
            requestAnimationFrame(update);
        }

        // Game Over Trigger
        function handleGameOver() {
            isGameOver = true;
            isPaused = true;
            sound.playGameOver();

            overlayTitle.innerText = "수확 완료!";
            overlaySub.innerText = `최종 점수 ${score}점 · 최대 ${maxChain}연쇄`;
            startBtn.innerText = "다시 시작";
            overlay.classList.remove('hidden');
        }

        // Reset and Start Game
        function startGame() {
            sound.init();
            initGrid();

            score = 0;
            maxChain = 0;
            level = 1;
            dropInterval = 800;
            isGameOver = false;
            isPaused = false;
            particles = [];

            scoreText.innerText = score;
            maxChainText.innerText = maxChain;
            levelText.innerText = level;

            nextPiece = getRandomPiece();
            spawnPiece();

            overlay.classList.add('hidden');
        }

        // Input Listeners
        window.addEventListener('keydown', (e) => {
            if (isPaused || isGameOver) return;

            switch (e.key) {
                case 'ArrowLeft':
                    moveLeft();
                    break;
                case 'ArrowRight':
                    moveRight();
                    break;
                case 'ArrowDown':
                    moveDown();
                    break;
                case 'ArrowUp':
                case 'x':
                case 'X':
                    rotate(1);
                    break;
                case 'z':
                case 'Z':
                    rotate(-1);
                    break;
            }
        });

        // Mobile Touch Button Listeners
        document.getElementById('btnLeft').addEventListener('click', () => moveLeft());
        document.getElementById('btnRight').addEventListener('click', () => moveRight());
        document.getElementById('btnDown').addEventListener('click', () => moveDown());
        document.getElementById('btnRotR').addEventListener('click', () => rotate(1));
        document.getElementById('btnRotL').addEventListener('click', () => rotate(-1));

        startBtn.addEventListener('click', () => {
            startGame();
        });

        // Sound Toggle
        soundToggleBtn.addEventListener('click', () => {
            sound.enabled = !sound.enabled;
            if (sound.enabled) {
                soundIcon.className = "fas fa-volume-up text-base";
                soundToggleBtn.style.color = '';
            } else {
                soundIcon.className = "fas fa-volume-mute text-base";
                soundToggleBtn.style.color = '#9aa79f';
            }
        });

        // Window Resize Handling
        window.addEventListener('resize', () => {
            resizeCanvas();
        });

        // Boot Initialization
        window.onload = () => {
            resizeCanvas();
            initGrid();
            requestAnimationFrame(update);
        };
    </script>
